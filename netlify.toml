# Netlify configuration for EagleVisionEdge

# Build command and directory
[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

# Environment variables (add your specific env vars here)
[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirects for Next.js
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache policies
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Context-specific settings for production
[context.production]
  command = "npm run build"

# Context-specific settings for deploy previews
[context.deploy-preview]
  command = "npm run build"

# Context-specific settings for branch deploys
[context.branch-deploy]
  command = "npm run build"

